沈迷   花束綻放的瞬間
耽溺   對白糾纏的迴響
卻沒有看見   答案
早已   顯現在
低體溫症狀`,detail:`你說愛會消失嗎？我覺得會。
低體溫症，一開始你冷，後來你很熱，再後來就死透了。`,pinned:!0,pinnedAt:3000000000000},{id:"w2",year:"2026.10.01",title:"嬤寶",type:"writing",desc:`其實那晚   我就知道
你說   只要我想要
你會盡力   幫我達到
絕對不是開玩笑
你的耐心   節儉   刻苦   勤勞
包容我吵鬧的 每個擁抱
不管我走多遠 變多老
我永遠都會是你的嬤寶`,detail:"我有一個很厲害的阿嬤。",pinned:!0,pinnedAt:2999999999000},{id:"w3",year:"2026.09.30",title:"294圈漣漪",type:"writing",desc:`你說...宇宙漂流的時候
有沒有...對永恆的講究

引力捕獲著你們相遇
你放下一部分的自己
橘色泰坦下的霧和雨
開啟了兩百九十四圈漣漪`,detail:`Salute to Cassini.
一台太空機器，輕而易舉偷了我的眼淚。`,pinned:!0,pinnedAt:2999999998000},{id:"w4",year:"2026.09.28",title:"跑屍模式",type:"writing",desc:`你不敢說   自殺是想過幾次
畢竟還有人   過更慘的日子
要死不活的狀態反覆幾次
只敢想像自己彈指般消失

你甚至不是社會的薛西佛斯
更像是飢渴挫敗的坦塔拉斯
假裝若無其事讓心聲消失
是人生懲罰機制跑屍模式
It’s time to hit reset.`,detail:`消極時間開始。
目前狀態：麻木。`},{id:"w5",year:"2026.09.23",title:"夕陽保鮮時效",type:"writing",desc:`時間一刻也不能早
暮色帶著你找
太陽沉下去的山腰
秋風在逆光裡失焦

魔幻時刻專屬色調
是任性自由的味道
唯一保證不偷工減料
you'll figure out
夕陽保鮮時效`,detail:`就是這天傍晚，義無反顧衝出家門。
到中央公園迎接夕陽。`},{id:"w6",year:"2026.09.22",title:"錯到底",type:"writing",desc:`我決定就錯到底
無論如何緊抱你
害怕失去般用力
像唯一解的認定

我決定就錯到底
義無反顧抓著你
利用你的些微善意
成全我的卑劣偏激`,detail:`一切始於那上身不著衣物的強制擁抱。
我不怪你，我怪我自己。`},{id:"w7",year:"2026.09.11",title:"Púca",type:"writing",desc:`Púca 鍛造現實 以侵蝕消耗
Púca 縫補靈魂 以乾枯鼓譟

Púca 不會一直停在原地
就像蒲公英
燦爛過後
隨風飄移`,detail:`Púca 是一種精靈，會惡作劇，也會修補物品。
完全休息的時候就很羨慕牛馬。`},{id:"w8",year:"2026.09.08",title:"回聲",type:"writing",desc:`我用回聲掩蓋軟弱
有些話只敢跟自己說出口
把眼淚強制回收
不讓重力有機會偷走

這是我親手下的詛咒
活該由我一個人承受
以為時間能磨掉難受
卻讓真心越來越斑駁`,detail:`記憶中的暗戀。
忽然發現一首無法再播放的歌，好懷念。
希臘神話中的Echo，最後只能枯萎在山林之中。`},{id:"w9",year:"2026.09.08",title:"會料理的老鼠",type:"writing",desc:`出前一丁 加蛋 打散
進微波爐 我旁邊站

吃完這頓 飯飯
等等來洗 碗碗
洗碗碗 洗碗碗

我是一隻會料理的老鼠`,detail:`吃泡麵的時候想起了soul boy
久久沒吃泡麵其實還蠻好吃的！`},{id:"w10",year:"2026.09.07",title:"慢訪",type:"writing",desc:`就這樣我開始我的慢訪
路上有什麼風景我都要望望
沿途有什麼食物我都要嚐嚐
我想要證明我從來沒有忘
that’s my trip
and will have lots of fun
that’s my beat
let it roll right off my tongue`,detail:`一切的開始，一場東部外島的旅行。
這時間我聽了很多陸饒。`},{id:"w11",year:"2026.09.07",title:"最困難的告別",type:"writing",desc:`開門後的   習慣沒有改
