<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:32px}
body{margin:0;background:#0A0A0A;color:#FAFAFA;font-family:"Noto Serif TC",serif;line-height:1.9;letter-spacing:.02em;-webkit-font-smoothing:antialiased}

.pagination button.active{color:#FAFAFA;border-bottom-color:#FAFAFA}

<script type="text/babel">
const {useState,useEffect,useMemo,useRef} = React;
const LS_WORKS = 'anchor_works_v3';
const LS_NOTES = 'anchor_notes_v3';
const LS_ABOUT = 'anchor_about_v3';
const PER_PAGE = 6;
const NOTES_PER_PAGE = 3;
const MAX_PAGES = 50;

function escapeHtml(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function parseDate(str){ if(!str) return null; let t=str.trim().replace(/\./g,'-').replace(/\//g,'-'); let d=Date.parse(t); return isNaN(d)?null:d; }
function sortWorks(arr){ return [...arr].sort((a,b)=>{ const pa=!!a.pinned, pb=!!b.pinned; if(pa&&!pb) return -1; if(!pa&&pb) return 1; if(pa&&pb){ let diff=(b.pinnedAt||0)-(a.pinnedAt||0); if(diff!==0) return diff; } let da=parseDate(a.year), db=parseDate(b.year); if(da!==null&&db!==null) return db-da; if(da!==null) return -1; if(db!==null) return 1; return 0; }); }
function sortNotes(arr){ return [...arr].sort((a,b)=>{ let da=parseDate(a.date), db=parseDate(b.date); if(da!==null&&db!==null) return db-da; if(da!==null) return -1; if(db!==null) return 1; return 0; }); }
function getPages(c,t){ if(t<=10){ return Array.from({length:t},(_,i)=>i+1); } let res=[1]; if(c>4) res.push('...'); let s=Math.max(2,c-2), e=Math.min(t-1,c+2); for(let i=s;i<=e;i++) res.push(i); if(c<t-3) res.push('...'); if(t>1) res.push(t); return res; }

function App(){
  const [works,setWorks]=useState(()=>{ try{const v=localStorage.getItem(LS_WORKS); if(v){const p=JSON.parse(v); if(Array.isArray(p)&&p.length) return p;}}catch{} return []; });
  const [notes,setNotes]=useState(()=>{ try{const v=localStorage.getItem(LS_NOTES); if(v){const p=JSON.parse(v); if(Array.isArray(p)) return p;}}catch{} return []; });
  const [about,setAbout]=useState(()=>{ try{const v=localStorage.getItem(LS_ABOUT); if(v) return JSON.parse(v);}catch{} return 'Write something about your practice here.'; });
  const [page,setPage]=useState(1);
  const [notesPage,setNotesPage]=useState(1);
  const [openId,setOpenId]=useState(null);
  const [openNoteId,setOpenNoteId]=useState(null);
  const [draft,setDraft]=useState(null);
  const [noteDraft,setNoteDraft]=useState(null);
  const [msg,setMsg]=useState('');
  const draftRef=useRef(null);
  const noteDraftRef=useRef(null);

  const sortedWorks=useMemo(()=>sortWorks(works),[works]);
  const sortedNotes=useMemo(()=>sortNotes(notes),[notes]);
  const totalPages=useMemo(()=>Math.min(MAX_PAGES, Math.max(1, Math.ceil(sortedWorks.length / PER_PAGE))),[sortedWorks.length]);
  const totalNotesPages=useMemo(()=>Math.min(MAX_PAGES, Math.max(1, Math.ceil(sortedNotes.length / NOTES_PER_PAGE))),[sortedNotes.length]);
  const slice=useMemo(()=>sortedWorks.slice((page-1)*PER_PAGE, page*PER_PAGE),[sortedWorks,page]);
  const notesSlice=useMemo(()=>sortedNotes.slice((notesPage-1)*NOTES_PER_PAGE, notesPage*NOTES_PER_PAGE),[sortedNotes,notesPage]);
  const pages=useMemo(()=>getPages(page,totalPages),[page,totalPages]);
  const notesPages=useMemo(()=>getPages(notesPage,totalNotesPages),[notesPage,totalNotesPages]);

  useEffect(()=>{ if(page>totalPages) setPage(totalPages); },[totalPages]);
  useEffect(()=>{ if(notesPage>totalNotesPages) setNotesPage(totalNotesPages); },[totalNotesPages]);
  useEffect(()=>{ try{localStorage.setItem(LS_WORKS, JSON.stringify(works));}catch(e){ setMsg('⚠️ works localStorage 已滿'); } },[works]);
  useEffect(()=>{ try{localStorage.setItem(LS_NOTES, JSON.stringify(notes));}catch(e){ setMsg('⚠️ notes localStorage 已滿'); } },[notes]);
  useEffect(()=>{ try{localStorage.setItem(LS_ABOUT, JSON.stringify(about));}catch{} },[about]);

  const addWorkDraft=()=>{ setDraft({id:'w_'+Date.now(),year:new Date().toISOString().slice(0,10).replace(/-/g,'.'),title:'',type:'writing',desc:'',detail:'',pinned:false,link:''}); setTimeout(()=>draftRef.current?.scrollIntoView({behavior:'smooth'}),100); };
  const confirmWork=()=>{ if(!draft) return; const item={...draft,title:draft.title.trim()||'Untitled',year:draft.year.trim()||new Date().toISOString().slice(0,10).replace(/-/g,'.'),pinnedAt:draft.pinned?Date.now():undefined}; setWorks(w=>[item,...w]); setPage(1); setDraft(null); setMsg(`已加入作品，現在 ${works.length+1} 首`); setTimeout(()=>setMsg(''),2500); };
  const updateWork=(id,k,v)=>{ setWorks(a=>a.map(x=>x.id===id?{...x,[k]:v}:x)); };
  const deleteWork=(id)=>{ if(!confirm('確定刪除這個作品？')) return; setWorks(a=>a.filter(x=>x.id!==id)); };
  const togglePin=(id)=>{ setWorks(a=>a.map(x=> x.id===id ? {...x, pinned:!x.pinned, pinnedAt: !x.pinned?Date.now():undefined } : x)); };

  const addNoteDraft=()=>{ setNoteDraft({id:'n_'+Date.now(),date:new Date().toISOString().slice(0,10).replace(/-/g,'.'),title:'',excerpt:'',text:''}); setTimeout(()=>noteDraftRef.current?.scrollIntoView({behavior:'smooth'}),100); };
  const confirmNote=()=>{ if(!noteDraft) return; const item={...noteDraft,title:noteDraft.title.trim()||'New Note',excerpt:noteDraft.excerpt||noteDraft.text?.slice(0,40)||''}; setNotes(n=>[item,...n]); setNotesPage(1); setNoteDraft(null); setMsg('已加入隨筆'); setTimeout(()=>setMsg(''),2000); };
  const updateNote=(id,k,v)=>{ setNotes(a=>a.map(x=>x.id===id?{...x,[k]:v, excerpt: k==='text' ? v.slice(0,60) : x.excerpt}:x)); };
  const deleteNote=(id)=>{ if(!confirm('確定刪除這則隨筆？')) return; setNotes(a=>a.filter(x=>x.id!==id)); };

  const exportHtml=()=>{
    const esc=escapeHtml;
    const workHtml=sortedWorks.map(m=>{
      const pin=m.pinned?'<span style="font-family:Inter,sans-serif;font-size:9px;border:1px solid #3A3A3A;padding:2px 6px;border-radius:9999px;background:rgba(250,250,250,.1)">↥ 置頂</span>':'';
      const link=m.link?`<div style="margin-top:14px"><span style="font-family:Inter,sans-serif;font-size:11px;border-bottom:1px solid rgba(250,250,250,.25)">${esc(m.link)}</span></div>`:'';
      return `<div class="work-item ${m.pinned?'pinned':''}"><div class="work-grid"><span class="work-date"><span style="display:flex;flex-direction:column;gap:4px">${pin}<span>${esc(m.year)}</span></span></span><span class="work-title">${esc(m.title)}</span><span class="work-type">/ ${esc(m.type)}</span><span class="work-desc">${esc(m.desc)}</span></div><div class="work-detail-outer"><div class="work-detail-inner"><div class="work-detail-box"><p style="font-size:13.5px;line-height:1.9;color:#D5D5D5;white-space:pre-wrap">${esc(m.detail)}</p>${link}</div></div></div></div>`;
    }).join('\n');
    const noteHtml=sortedNotes.map(n=>{ return `<div class="note-item"><span class="note-date">${esc(n.date)}</span><div class="note-main"><div class="note-title">${esc(n.title)}</div><div class="note-excerpt">${esc(n.excerpt||n.text?.slice(0,60)||'')}</div></div></div>`; }).join('\n');
    const html=`<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANCHOR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">

</style></head><body><div class="wrap">
<header class="header"><div><div style="font-family:Inter;font-size:14px;letter-spacing:.32em">人生就是＃哭笑不得</div><div style="font-family:Inter;font-size:11px;color:#B0B0B0">希望可以跟神木一起長眠 🌲</div></div><nav style="display:flex;gap:18px;font-family:Inter;font-size:12px"><a href="#works">Works</a><a href="#notes">Notes</a><a href="#about">About</a></nav></header>

<script>
(function(){
  var PER_PAGE=${PER_PAGE};
  var items=[].slice.call(document.querySelectorAll('.work-item'));
  var pagEl=document.getElementById('works-pagination');
  var total=Math.min(${MAX_PAGES}, Math.ceil(items.length/PER_PAGE));
  var cur=1;
  function getPages(c,t){ if(t<=10){var a=[];for(var i=1;i<=t;i++)a.push(i);return a;} var res=[1]; if(c>4) res.push('...'); var s=Math.max(2,c-2), e=Math.min(t-1,c+2); for(var i=s;i<=e;i++) res.push(i); if(c<t-3) res.push('...'); if(t>1) res.push(t); return res; }
  function renderPage(p){ cur=p; var st=(p-1)*PER_PAGE, ed=st+PER_PAGE; items.forEach(function(el,i){ el.style.display=(i>=st&&i<ed)?'':'none'; if(el.style.display==='none') el.classList.remove('open'); }); renderPag(); }
  function renderPag(){ if(!pagEl) return; if(total<=1){ pagEl.style.display='none'; return; } pagEl.style.display='flex'; pagEl.innerHTML=''; var pg=getPages(cur,total); pg.forEach(function(v){ if(v==='...'){ var sp=document.createElement('span'); sp.textContent='...'; sp.style.cssText='color:#555;padding:6px 2px'; pagEl.appendChild(sp); } else { var b=document.createElement('button'); b.textContent=v; b.className=(v===cur)?'active':'inactive'; b.addEventListener('click',(function(page){return function(){renderPage(page); document.getElementById('works').scrollIntoView({behavior:'smooth'});}})(v)); pagEl.appendChild(b); } }); }
  items.forEach(function(it){ var g=it.querySelector('.work-grid'); if(!g) return; g.addEventListener('click',function(){ var was=it.classList.contains('open'); items.forEach(function(o){o.classList.remove('open')}); if(!was) it.classList.add('open'); }); });
  if(items.length>PER_PAGE) renderPage(1); else renderPag();
})();
<\/script></body></html>`;

  };

      <section className="section">

          <span style={{marginLeft:'12px',color:'#555',fontSize:'11px'}}>跳頁 <input type="number" min={1} max={totalPages} value={page} onChange={e=>{let n=parseInt(e.target.value)||1; if(n>=1&&n<=totalPages) setPage(n)}} style={{width:'60px',display:'inline-block',padding:'4px'}}/> / {totalPages}</span>
        </div>
        <button onClick={addWorkDraft} style={{marginTop:'24px',fontFamily:'Inter',fontSize:'11px',border:'1px dashed #2A2A2A',borderRadius:'9999px',padding:'10px 18px'}}>+ 新增作品</button>
      </section>

      {draft && (
        <section ref={draftRef} style={{background:'#111',border:'1px solid #2A2A2A',borderRadius:'12px',padding:'20px',marginBottom:'32px'}}>
          <div style={{fontFamily:'Inter',fontSize:'11px',marginBottom:'12px'}}>新增作品草稿</div>
          <div style={{display:'grid',gap:'10px'}}>
            <input value={draft.year} onChange={e=>setDraft({...draft,year:e.target.value})}/>
            <input value={draft.title} onChange={e=>setDraft({...draft,title:e.target.value})} placeholder="標題"/>
            <input value={draft.type} onChange={e=>setDraft({...draft,type:e.target.value})} placeholder="類型"/>
            <textarea value={draft.desc} onChange={e=>setDraft({...draft,desc:e.target.value})} placeholder="簡述"/>
            <textarea value={draft.detail} onChange={e=>setDraft({...draft,detail:e.target.value})} placeholder="詳細"/>
            <label style={{display:'flex',gap:'6px',fontSize:'11px'}}><input type="checkbox" checked={draft.pinned} onChange={e=>setDraft({...draft,pinned:e.target.checked})}/> 置頂</label>
            <div style={{display:'flex',gap:'10px'}}>
              <button onClick={confirmWork} style={{background:'#FAFAFA',color:'#000',borderRadius:'9999px',padding:'8px 18px',fontSize:'11px'}}>確認加入</button>
              <button onClick={()=>setDraft(null)} style={{border:'1px solid #2A2A2A',borderRadius:'9999px',padding:'8px 18px',fontSize:'11px'}}>取消</button>
            </div>
          </div>
        </section>
      )}

      <section className="section">
        <div className="section-head">
          <h2 style={{fontFamily:'Inter',fontSize:'11px',letterSpacing:'.18em',textTransform:'uppercase'}}>Notes — {sortedNotes.length} 則</h2>
          <span style={{fontFamily:'Inter',fontSize:'11px',color:'#8E8E8E'}}>第 {notesPage} / {totalNotesPages} 頁 · 3則一頁 · 支援 {MAX_PAGES} 頁</span>
        </div>
        {notesSlice.map(n=>(
          <div key={n.id} className="note-item" style={{display:'block'}}>
            <div style={{display:'flex',justifyContent:'space-between',cursor:'pointer'}} onClick={()=>setOpenNoteId(openNoteId===n.id?null:n.id)}>
              <div style={{display:'flex',gap:'16px',flex:1}}>
                <span className="note-date">{n.date}</span>
                <div className="note-main"><div className="note-title">{n.title}</div><div className="note-excerpt">{n.excerpt||n.text?.slice(0,60)}</div></div>
              </div>
              <span style={{color:'#555'}}> {openNoteId===n.id?'—':'＋'} </span>
            </div>
            {openNoteId===n.id && (
              <div style={{marginTop:'12px',marginLeft:'90px',background:'#111',border:'1px solid #2A2A2A',borderRadius:'12px',padding:'16px',display:'grid',gap:'10px'}}>
                <input value={n.date} onChange={e=>updateNote(n.id,'date',e.target.value)} placeholder="日期 (最新會自動排最前)"/>
                <input value={n.title} onChange={e=>updateNote(n.id,'title',e.target.value)} placeholder="標題"/>
                <textarea value={n.text||''} onChange={e=>updateNote(n.id,'text',e.target.value)} placeholder="內文" style={{minHeight:'100px'}}/>
                <div style={{display:'flex',gap:'8px'}}>
                  <button onClick={()=>deleteNote(n.id)} style={{fontSize:'11px',color:'#ff6b6b'}}>刪除此則</button>
                </div>
              </div>
            )}
          </div>
        ))}
        <div className="pagination">
          <button className="inactive" onClick={()=>setNotesPage(p=>Math.max(1,p-1))}>←</button>
          {notesPages.map((v,i)=> v==='...' ? <span key={i} className="dots">...</span> : <button key={'n-'+v} className={v===notesPage?'active':'inactive'} onClick={()=>setNotesPage(v)}>{v}</button>)}
          <button className="inactive" onClick={()=>setNotesPage(p=>Math.min(totalNotesPages,p+1))}>→</button>
          <span style={{marginLeft:'12px',color:'#555',fontSize:'11px'}}>跳頁 <input type="number" min={1} max={totalNotesPages} value={notesPage} onChange={e=>{let n=parseInt(e.target.value)||1; if(n>=1&&n<=totalNotesPages) setNotesPage(n)}} style={{width:'60px',display:'inline-block',padding:'4px'}}/> / {totalNotesPages}</span>
        </div>
        <button onClick={addNoteDraft} style={{marginTop:'24px',fontFamily:'Inter',fontSize:'11px',border:'1px dashed #2A2A2A',borderRadius:'9999px',padding:'10px 18px'}}>+ 新增隨筆</button>
      </section>

      {noteDraft && (
        <section ref={noteDraftRef} style={{background:'#111',border:'1px solid #2A2A2A',borderRadius:'12px',padding:'20px',marginBottom:'32px'}}>
          <div style={{fontFamily:'Inter',fontSize:'11px',marginBottom:'12px'}}>新增隨筆草稿</div>
          <div style={{display:'grid',gap:'10px'}}>
            <input value={noteDraft.date} onChange={e=>setNoteDraft({...noteDraft,date:e.target.value})} placeholder="2026.10.06"/>
            <input value={noteDraft.title} onChange={e=>setNoteDraft({...noteDraft,title:e.target.value})} placeholder="標題"/>
            <textarea value={noteDraft.text} onChange={e=>setNoteDraft({...noteDraft,text:e.target.value})} placeholder="隨筆內文"/>
            <div style={{display:'flex',gap:'10px'}}>
              <button onClick={confirmNote} style={{background:'#FAFAFA',color:'#000',borderRadius:'9999px',padding:'8px 18px',fontSize:'11px'}}>確認加入</button>
              <button onClick={()=>setNoteDraft(null)} style={{border:'1px solid #2A2A2A',borderRadius:'9999px',padding:'8px 18px',fontSize:'11px'}}>取消</button>
            </div>
          </div>
        </section>
      )}

      <section className="section">
        <div className="section-head"><h2 style={{fontFamily:'Inter',fontSize:'11px',letterSpacing:'.18em',textTransform:'uppercase'}}>About</h2></div>
        <textarea value={about} onChange={e=>setAbout(e.target.value)} style={{minHeight:'120px',maxWidth:'560px',marginLeft:'90px'}}/>
      </section>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
